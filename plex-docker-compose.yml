name: plex

services:
    plex:
        image: plexinc/pms-docker:latest
        container_name: plex
        # Binds LAN + Tailscale directly. ADVERTISE_IP is ignored, so remote
        # access relies on "Custom server access URLs" in Preferences.xml.
        network_mode: host
        hostname: PlexServer
        environment:
            # The official image uses PLEX_UID/PLEX_GID, not PUID/PGID.
            - PLEX_UID=${PUID}
            - PLEX_GID=${PGID}
            - TZ=${TZ}
        devices:
            - /dev/dri:/dev/dri
        volumes:
            - ./plex/library:/config
            - ./plex/transcode:/transcode
            # Paths match the old setup so library sections keep resolving.
            - /data/shows:/tv
            - /data/movies:/movies
            - /data/videos:/videos
            - /mnt/hdd:/hdd
        restart: unless-stopped
