services:
    # Plex activity/history monitoring: who watched what, direct play vs
    # direct stream vs transcode, bandwidth per session, client versions.
    # https://github.com/Tautulli/Tautulli
    tautulli:
        image: ghcr.io/tautulli/tautulli:latest
        container_name: tautulli
        restart: unless-stopped
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
        ports:
            - 8181:8181
        volumes:
            - ./tautulli/config:/config
            # Read-only access to Plex's own logs. Tautulli can parse them for
            # a few things the API does not expose (e.g. failed-login history).
            - ./plex/library/Library/Application Support/Plex Media Server/Logs:/plex_logs:ro
        # Plex runs with network_mode: host, so from this bridge container it is
        # reachable at the host's LAN IP. During setup enter:
        #   Plex IP/Hostname: the value of HOST_LAN_IP    Port: 32400    SSL: off
        # (Do NOT use "localhost" — that resolves inside this container.)
        extra_hosts:
            - "plexserver:${HOST_LAN_IP}"
