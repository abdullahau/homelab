name: nvr

services:
  # TP-Link Tapo RTSP/Onvif Protocol Settings:  https://www.tp-link.com/ae/support/faq/2680/
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    user: "1000:1000"
    # host net: bridge NAT hid client IPs and defeated the ips: allowlist.
    # Ports (set in mediamtx.yml): 8889 WebRTC + 8888 HLS -> /living-room/,
    # 8554 RTSP, 8189/udp ICE, 9996 playback API, 9997 control (127.0.0.1 only)
    network_mode: host
    environment:
      - MTX_RTSPTRANSPORTS=tcp
      - MTX_WEBRTCADDITIONALHOSTS=${HOST_LAN_IP},${HOST_TS_IP},${MACHINE_NAME_TS}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - /mnt/hdd/footage/recordings:/recordings
      - /etc/localtime:/etc/localtime:ro
