services:
  # https://docs.linuxserver.io/images/docker-transmission/
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - USER=${TRANSMISSION_USERNAME}
      - PASS=${TRANSMISSION_PASSWORD}
      # - WHITELIST=127.0.0.1,::1,100.105.211.56
      - PEERPORT=51413
    volumes:
      - ./transmission:/config
      - /data:/downloads 
      - /data/downloads/torrents:/watch 
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped

  # https://jellyfin.org/docs/general/installation/container/
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - type: bind
        source: /data/movies
        target: /movies
      - type: bind
        source: /data/shows
        target: /shows
        read_only: true
    restart: 'unless-stopped'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # https://hub.docker.com/r/linuxserver/plex
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - device=/dev/dri:/dev/dri
    volumes:
      - ./plex/library:/config
      - /data/shows:/tv
      - /data/movies:/movies
      - /data/videos:/videos
    restart: unless-stopped

  # https://github.com/swingmx/swingmusic
  swingmusic:
    image: ghcr.io/swingmx/swingmusic:latest
    container_name: swingmusic
    volumes:
      - /data/music:/music
      - ./swingmusic/config:/config
    ports:
      - "1970:1970"
    restart: unless-stopped

