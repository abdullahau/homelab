services:
    # Hub: web dashboard + datastore. https://beszel.dev
    beszel:
        image: henrygd/beszel:latest
        container_name: beszel
        restart: unless-stopped
        environment:
            # Must match the URL you actually open the dashboard on, otherwise
            # alert emails / links point at the wrong host.
            - APP_URL=http://homelab:8090
            - TZ=${TZ}
        ports:
            - 8090:8090
        volumes:
            - ./beszel/data:/beszel_data
            # Shared with the agent below so the two talk over a unix socket
            # instead of exposing the agent's port 45876 on the network.
            - ./beszel/socket:/beszel_socket

    # Agent: collects CPU/mem/disk/net + per-container stats for THIS host.
    # One agent per monitored machine; add the Oracle VPSs later by running
    # the agent there and pointing HUB_URL at this hub over Tailscale.
    beszel-agent:
        # :alpine (not :latest) — it is the only tag shipping smartmontools,
        # which the S.M.A.R.T. collector shells out to. :latest is scratch-based
        # and logs `exec: "smartctl": executable file not found in $PATH`.
        image: henrygd/beszel-agent:alpine
        container_name: beszel-agent
        restart: unless-stopped
        # Host networking so it sees the real interfaces (enx*, tailscale0)
        # rather than the container's veth pair.
        network_mode: host
        # Docker's default AppArmor profile blocks D-Bus, so systemd collection
        # fails with "Sender is not authorized to send message" even once the
        # bus socket is mounted below. The container already has docker.sock,
        # so this is not a meaningful widening of what it can reach.
        security_opt:
            - apparmor:unconfined
        # S.M.A.R.T. disk health. Base controllers only, never partitions. The
        # SD-card reader is left out (empty). Verified both pass SAT through:
        # the APPLE SSD SM0512G, and the SAMSUNG HN-M101MBB inside the Transcend
        # USB enclosure.
        #
        # Addressed by /dev/disk/by-id (drive serial) rather than /dev/sdX: the
        # kernel's enumeration order is not stable. The 2026-08-17 reboot moved
        # the USB disk sdd -> sdb, and the hardcoded /dev/sdd made dockerd refuse
        # to create the container at all (exit 128, "error gathering device
        # information") — which `restart: unless-stopped` cannot retry, because
        # the failure is in device setup before the process ever starts.
        # NOT by-path (encodes the USB port, breaks on replug) and NOT the
        # usb-StoreJet_Transcend-0:0 alias (the colons collide with compose's
        # own host:container:mode splitting -> "bad mode specified").
        # The container-side names are fixed so `smartctl --scan` finds them
        # regardless of what the host calls the disks on a given boot.
        #
        # These paths encode the DRIVE SERIAL, so swapping the disk in the
        # Transcend caddy (or replacing the SSD) requires updating the serial
        # here — otherwise dockerd refuses to create the container and ALL host
        # monitoring stops, not just this disk's S.M.A.R.T. Get the new value
        # from `ls -l /dev/disk/by-id/` (pick a colon-free name).
        devices:
            - /dev/disk/by-id/ata-APPLE_SSD_SM0512G_S29ANYAH206105:/dev/sda
            - /dev/disk/by-id/ata-SAMSUNG_HN-M101MBB_S2RXJ9BBA06779:/dev/sdb
        # smartctl issues raw ATA passthrough ioctls; both caps are required.
        cap_add:
            - SYS_RAWIO
            - SYS_ADMIN
        environment:
            - LISTEN=/beszel_socket/beszel.sock
            - HUB_URL=http://localhost:8090
            # Both are shown by the hub's "Add System" dialog on first run.
            # Stored in .env (gitignored) — see BESZEL_* entries.
            - TOKEN=${BESZEL_TOKEN}
            - KEY=${BESZEL_KEY}
            - TZ=${TZ}
        volumes:
            - ./beszel/agent_data:/var/lib/beszel-agent
            - ./beszel/socket:/beszel_socket
            # Read-only: powers the per-container CPU/mem/net breakdown.
            - /var/run/docker.sock:/var/run/docker.sock:ro
            # System D-Bus: powers the "Systemd Services" tab (per-unit CPU,
            # memory, restart counts) — i.e. everything running outside Docker.
            # Needs systemd >= 243 for ListUnitsByPatterns; host runs 255.
            - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
            # Surfaces the USB HDD as a tracked filesystem. If the disk is not
            # mounted this binds an empty dir and simply reports ~0 usage —
            # a useful side-effect: it makes the mount-guard failure visible.
            - /mnt/hdd:/extra-filesystems/hdd:ro
