name: adguard

services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    # Host networking so AdGuard sees real client IPs. Under bridge every query
    # would appear to come from the docker gateway, breaking per-client stats
    # and rules. It also makes any `ports:` block a no-op, so there is none.
    #
    # Live bindings (AdGuardHome.yaml): 0.0.0.0:53 tcp+udp (DNS), 0.0.0.0:80
    # (web UI). TLS, DHCP and DNSCrypt are disabled, so 443/853/67/68 are idle.
    network_mode: host
    environment:
        - TZ=${TZ}
    volumes:
      - ./adguard-home/work:/opt/adguardhome/work
      - ./adguard-home/confdir:/opt/adguardhome/conf
