services:
  # https://github.com/technomancer702/nodecast-tv
  nodecast-tv:
    image: ghcr.io/technomancer702/nodecast-tv:latest
    container_name: nodecast-tv
    ports:
      - "3000:3000"
    volumes:
      - ./nodecast:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000

