services:
    # https://jellyfin.org/docs/general/installation/container/
    jellyfin:
        image: jellyfin/jellyfin:latest
        container_name: jellyfin
        ports:
            - 8096:8096/tcp
            - 7359:7359/udp
        volumes:
            - ./jellyfin/config:/config
            - ./jellyfin/cache:/cache
            - type: bind
              source: /data/movies
              target: /movies
            - type: bind
              source: /data/shows
              target: /shows
            - type: bind
              source: /mnt/hdd
              target: /hdd
        # No /dev/dri: transcodes run in software. Keep client bitrate caps
        # unlimited so clients direct play instead.
        restart: 'unless-stopped'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
